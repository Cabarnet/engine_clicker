<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Clicker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="offline-earning">
        <div class="background"></div>
        <div class="content">
            <p class="text">За время вне сети ваши работники заработали:</p>
            <p id="sum"></p>
            <button id="close-offline-earning">Закрыть</button>
        </div>
    </div>

    <p id="nuts-count"><img src="img/Nut.png" alt="o">: <span></span></p>
    <div class="main-view">
        <button id="restart-game">Рестарт</button>
        <button id="engine"></button>
    </div>
    <div class="upgrade-view">
        <h3>Прокачка клика</h3>
        <p>Буст гаек за клик <br>(+1) 
            <button id="up-nuts-per-click">
                <span></span>
                <img src="img/Nut.png" alt="o">
            </button>
        </p>
        <p>Буст шанса суперклика <br>(+1%) 
            <button id="up-chance-super-click">
                <span></span>
                <img src="img/Nut.png" alt="o">
            </button>
        </p>
        <p>Буст величины суперклика <br>(+50%) 
            <button id="up-super-click-value">
                <span></span>
                <img src="img/Nut.png" alt="o">
            </button>
        </p>
        <h3>Починить двигатель</h3>
        <p> 
            <button id="upgrade-engine">
                <span>1 000 000</span>
                <img src="img/Nut.png" alt="o">
            </button>
        </p>
    </div>
    <div class="workers-view">
        <h3>Работники</h3>
        <p>Нанять работника <br>(+30 гаек в секунду) 
            <button id="hire-worker">
                <span>1000</span>
                <img src="img/Nut.png" alt="o">
            </button>
        </p>
    </div>
    <div class="bottom-menu">
        <button class="active" id="main-view-btn">Главная</button>
        <button id="upgrade-view-btn">Прокачка</button>
        <button id="workers-view-btn">Работники</button>
    </div>

    <div class="main-quest-dialog">
        <div class="background"></div>
        <p class="continue">(Нажмите, чтобы продолжить)</p>
        <div class="content">
            <img src="" alt="Uncle">
            <p id="main-quest-text"></p>
        </div>
    </div>

        <img src="img/Engine.png" alt="">

        <img src="img/Nut.png" alt="">
        <img src="img/Support_Funny.png" alt="">

        <img src="img/Support_Strict.png" alt="">
    </div>

    <script src="js/variables.js"></script>
